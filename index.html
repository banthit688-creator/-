<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>งานและกำหนดส่ง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F7F8;--surface:#FFFFFF;--ink:#16303B;--muted:#62767F;--line:#DCE5E8;--accent:#2F5BEA;--accent-ink:#FFFFFF;--soft:#E8EEFD;--late:#D1384A;--today:#C27A00;--ok:#1F8F63;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A1F;--surface:#17252C;--ink:#E6EEF1;--muted:#94A8B1;--line:#2A3C45;--accent:#7C9BFF;--accent-ink:#0F1A1F;--soft:#1F2F52;--late:#FF7D8C;--today:#F0B34A;--ok:#4FD1A0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A1F;--surface:#17252C;--ink:#E6EEF1;--muted:#94A8B1;--line:#2A3C45;--accent:#7C9BFF;--accent-ink:#0F1A1F;--soft:#1F2F52;--late:#FF7D8C;--today:#F0B34A;--ok:#4FD1A0;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:32px 20px 64px}
h1{font-size:28px;line-height:1.3;margin:0 0 4px;font-weight:700}
.sub{color:var(--muted);margin:0 0 24px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 28px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:24px}
.day{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 0 6px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.35}
.day small{color:var(--muted);font-size:12px}
.day b{font-size:18px}
.day .n{height:6px;display:flex;gap:2px;margin-top:2px}
.day .n i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"] small{color:inherit}
.day[aria-pressed="true"] .n i{background:var(--accent-ink)}
form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-bottom:24px}
form .full{grid-column:1/-1}
label{font-size:14px;color:var(--muted);display:grid;gap:4px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.add{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px;cursor:pointer}
.tabs{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.tab{font:inherit;font-size:14px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:4px 14px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--soft);color:var(--ink);border-color:var(--accent)}
h2{font-size:15px;margin:24px 0 8px;font-weight:700;display:flex;gap:8px;align-items:center}
h2 span{color:var(--muted);font-weight:400}
h2.late{color:var(--late)}h2.today{color:var(--today)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-left-width:4px}
li.high{border-left-color:var(--late)}li.mid{border-left-color:var(--today)}li.low{border-left-color:var(--line)}
li input[type=checkbox]{width:22px;height:22px;accent-color:var(--ok);flex:none;padding:0}
.t{flex:1;min-width:0}
.t strong{display:block;font-weight:500;overflow-wrap:anywhere}
.t small{color:var(--muted)}
li.done .t strong{text-decoration:line-through;color:var(--muted)}
.cal{font-size:13px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:2px 10px;white-space:nowrap}
.del{background:none;border:0;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:8px}
.del:hover{color:var(--late)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
@media (max-width:480px){form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>งานและกำหนดส่ง</h1>
  <p class="sub" id="sub"></p>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <div class="strip" id="strip" role="group" aria-label="7 วันข้างหน้า"></div>

  <form id="f">
    <label class="full">ชื่องาน<input id="title" required maxlength="120" placeholder="เช่น รายงานกลุ่มวิชาสถิติ"></label>
    <label>วิชา<input id="subject" maxlength="40" placeholder="เช่น สถิติ"></label>
    <label>วันที่ส่ง<input id="due" type="date" required></label>
    <label>เวลาเตือน (วันที่ส่ง)<input id="rt" type="time" value="08:00"></label>
    <label>ความสำคัญ
      <select id="pri"><option value="high">สูง</option><option value="mid" selected>กลาง</option><option value="low">ต่ำ</option></select>
    </label>
    <button class="add full" type="submit">เพิ่มงาน</button>
  </form>

  <div class="tabs" id="tabs" role="group" aria-label="กรองงาน">
    <button class="tab" data-f="todo" aria-pressed="true">ยังไม่เสร็จ</button>
    <button class="tab" data-f="done" aria-pressed="false">เสร็จแล้ว</button>
    <button class="tab" data-f="all" aria-pressed="false">ทั้งหมด</button>
  </div>
  <div id="list"></div>
</main>

<script>
(function(){
  var KEY='student-tasks-v1', tasks=[], filter='todo', pickDay=null;
  var $=function(id){return document.getElementById(id)};
  function ymd(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
  function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
  var today=new Date();today.setHours(0,0,0,0);
  function diff(s){return Math.round((parse(s)-today)/864e5)}
  function addDays(n){var d=new Date(today);d.setDate(d.getDate()+n);return d}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function short(s){return parse(s).toLocaleDateString('th-TH',{day:'numeric',month:'short'})}
  function load(){
    try{var r=localStorage.getItem(KEY);if(r){tasks=JSON.parse(r);return}}catch(e){}
    tasks=[
      {id:1,title:'ส่งรายงานบทที่ 1',subject:'ภาษาไทย',due:ymd(addDays(1)),pri:'high',done:false},
      {id:2,title:'อ่านสไลด์ก่อนสอบย่อย',subject:'ชีววิทยา',due:ymd(addDays(3)),pri:'mid',done:false},
      {id:3,title:'ทำแบบฝึกหัดบทที่ 4',subject:'คณิตศาสตร์',due:ymd(addDays(6)),pri:'low',done:false}
    ];
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}

  function strip(){
    var days=['อา','จ','อ','พ','พฤ','ศ','ส'],h='';
    for(var i=0;i<7;i++){
      var d=addDays(i),k=ymd(d),n=tasks.filter(function(t){return !t.done&&t.due===k}).length,dots='';
      for(var j=0;j<Math.min(n,3);j++)dots+='<i></i>';
      h+='<button class="day" data-d="'+k+'" aria-pressed="'+(pickDay===k)+'"><small>'+(i===0?'วันนี้':days[d.getDay()])+'</small><b>'+d.getDate()+'</b><span class="n">'+dots+'</span></button>';
    }
    $('strip').innerHTML=h;
  }
  function item(t){
    var df=diff(t.due),note=df<0?'เลยกำหนด '+(-df)+' วัน':df===0?'ส่งวันนี้':df===1?'ส่งพรุ่งนี้':'อีก '+df+' วัน';
    return '<li class="'+t.pri+(t.done?' done':'')+'"><input type="checkbox" data-c="'+t.id+'" '+(t.done?'checked':'')+' aria-label="เสร็จแล้ว"><div class="t"><strong>'+esc(t.title)+'</strong><small>'+(t.subject?esc(t.subject)+' · ':'')+short(t.due)+' · '+note+'</small></div><a class="cal" target="_blank" rel="noopener" href="'+cal(t)+'">ตั้งเตือน</a><button class="del" data-x="'+t.id+'" aria-label="ลบงาน">×</button></li>';
  }
  function cal(t){
    var h=(t.rt||'08:00').split(':'),s=t.due.replace(/-/g,'')+'T'+h[0]+h[1]+'00',e=parse(t.due);
    e.setHours(+h[0],+h[1]+30);
    var p=function(n){return n<10?'0'+n:''+n};
    var E=e.getFullYear()+p(e.getMonth()+1)+p(e.getDate())+'T'+p(e.getHours())+p(e.getMinutes())+'00';
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('ส่งงาน: '+t.title)+'&details='+encodeURIComponent(t.subject||'')+'&dates='+s+'/'+E;
  }
  function group(title,cls,arr){
    if(!arr.length)return'';
    arr.sort(function(a,b){return a.due<b.due?-1:a.due>b.due?1:0});
    return '<h2 class="'+cls+'">'+title+' <span>'+arr.length+'</span></h2><ul>'+arr.map(item).join('')+'</ul>';
  }
  function render(){
    var pend=tasks.filter(function(t){return !t.done}),done=tasks.filter(function(t){return t.done});
    $('sub').textContent=pend.length?('เหลือ '+pend.length+' งานที่ยังไม่ส่ง'):'ไม่มีงานค้าง';
    $('bar').style.width=(tasks.length?Math.round(done.length/tasks.length*100):0)+'%';
    strip();
    var h='',showP=filter!=='done',showD=filter!=='todo';
    if(showP){
      var p=pend.filter(function(t){return !pickDay||t.due===pickDay});
      if(pickDay){h+=group(short(pickDay),'',p)}
      else{
        h+=group('เลยกำหนด','late',p.filter(function(t){return diff(t.due)<0}));
        h+=group('วันนี้','today',p.filter(function(t){return diff(t.due)===0}));
        h+=group('7 วันข้างหน้า','',p.filter(function(t){var d=diff(t.due);return d>0&&d<=7}));
        h+=group('ภายหลัง','',p.filter(function(t){return diff(t.due)>7}));
      }
    }
    if(showD){h+=group('เสร็จแล้ว','',done.filter(function(t){return !pickDay||t.due===pickDay}))}
    $('list').innerHTML=h||'<p class="empty">ยังไม่มีงานในมุมมองนี้ เพิ่มงานแรกได้ที่ฟอร์มด้านบน</p>';
  }

  $('f').addEventListener('submit',function(e){
    e.preventDefault();
    tasks.push({id:Date.now(),title:$('title').value.trim(),subject:$('subject').value.trim(),due:$('due').value,rt:$('rt').value||'08:00',pri:$('pri').value,done:false});
    save();$('title').value='';$('subject').value='';render();
  });
  $('list').addEventListener('click',function(e){
    var x=e.target.getAttribute('data-x'),c=e.target.getAttribute('data-c');
    if(x){tasks=tasks.filter(function(t){return t.id!=x});save();render()}
    if(c){tasks.forEach(function(t){if(t.id==c)t.done=e.target.checked});save();render()}
  });
  $('strip').addEventListener('click',function(e){
    var b=e.target.closest('.day');if(!b)return;
    var k=b.getAttribute('data-d');pickDay=pickDay===k?null:k;render();
  });
  $('tabs').addEventListener('click',function(e){
    var b=e.target.closest('.tab');if(!b)return;
    filter=b.getAttribute('data-f');
    Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){t.setAttribute('aria-pressed',t===b)});
    render();
  });
  $('due').value=ymd(addDays(1));
  load();render();
})();
</script>
</body>
</html>
